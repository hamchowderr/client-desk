<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client Desk</title>
    <style>
      :root {
        --bg: #fbfaf7;
        --panel: #ffffff;
        --ink: #1d1b18;
        --muted: #6b665e;
        --line: #e6e1d8;
        --accent: #b4532a;
        --warn: #b42318;
        --ok: #2f6f4f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171614;
          --panel: #201f1c;
          --ink: #f1ede6;
          --muted: #a8a197;
          --line: #34312c;
          --accent: #e0855c;
          --warn: #f97066;
          --ok: #6fcf97;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
      #root { padding: 16px; }
      #root.loading { opacity: 0.6; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      h1 { font-size: 17px; margin: 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 16px 0 6px; }
      button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
      .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
      .stat .n { font-size: 20px; font-weight: 600; }
      .stat .l { color: var(--muted); font-size: 12px; }
      .stat.warn { border-color: var(--warn); }
      .stat.warn .n { color: var(--warn); }
      .clients { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 16px; }
      article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .chead { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
      .pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
      .pill.active { color: var(--ok); border-color: var(--ok); }
      .pill.paused, .pill.cancelling { color: var(--accent); border-color: var(--accent); }
      .group { margin-top: 6px; }
      .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .row { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; padding: 3px 0; border-top: 1px solid var(--line); }
      .row:first-of-type { border-top: 0; }
      .row .meta { grid-column: 2; }
      .rid { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
      .meta { color: var(--muted); font-size: 12px; }
      .overdue .rid, .overdue .meta { color: var(--warn); }
      .empty { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root">Loading the board…</div>
    <script type="module">/*BOARD_JS*/</script>
  </body>
</html>
