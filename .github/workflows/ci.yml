name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Again west of UTC: date code that leans on the machine's zone breaks there.
      - run: npm test
        env:
          TZ: America/Los_Angeles
      - run: npm run build
